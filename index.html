<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калининград — Копилка</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #16002e, #3b146f, #6d28a8);
        color: white;
        min-height: 100vh;
        padding: 30px 15px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 42px;
        margin: 0 0 10px;
    }

    .header p {
        color: #ddd0f5;
        font-size: 18px;
        margin: 0;
    }

    .card {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 24px;
        padding: 25px;
        margin-bottom: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 25px;
    }

    .stat {
        background: rgba(0,0,0,0.18);
        border-radius: 18px;
        padding: 20px;
        text-align: center;
    }

    .stat-title {
        color: #d9c8f2;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .stat-value {
        font-size: 26px;
        font-weight: bold;
    }

    .progress-title {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .progress-bg {
        width: 100%;
        height: 24px;
        background: rgba(0,0,0,0.3);
        border-radius: 50px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c084fc, #f0abfc);
        border-radius: 50px;
        transition: width 0.5s ease;
    }

    .table-title {
        font-size: 24px;
        margin-bottom: 18px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 15px;
    }

    th {
        background: rgba(0,0,0,0.3);
        padding: 14px;
        text-align: left;
    }

    td {
        padding: 13px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    tr:last-child td {
        border-bottom: none;
    }

    tr:hover {
        background: rgba(255,255,255,0.06);
    }

    .saved {
        color: #e9b7ff;
        font-weight: bold;
    }

    .total-row {
        background: rgba(255,255,255,0.08);
        font-weight: bold;
    }

    .footer {
        text-align: center;
        color: #cbb8df;
        font-size: 14px;
        margin-top: 25px;
    }

    @media (max-width: 700px) {
        .header h1 {
            font-size: 32px;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        .card {
            padding: 18px;
        }

        table {
            font-size: 14px;
        }

        th, td {
            padding: 10px 7px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✈️ Калининград</h1>
        <p>Моя копилка на поездку</p>
    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="stat-title">Цель</div>
                <div class="stat-value">60 000 ₽</div>
            </div>

            <div class="stat">
                <div class="stat-title">Накоплено</div>
                <div class="stat-value" id="saved">0 ₽</div>
            </div>

            <div class="stat">
                <div class="stat-title">Осталось</div>
                <div class="stat-value" id="left">60 000 ₽</div>
            </div>

        </div>

        <div class="progress-title">
            <span>Прогресс</span>
            <span id="percent">0%</span>
        </div>

        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>

    </div>

    <div class="card">

        <div class="table-title">
            📅 План накоплений
        </div>

        <table>

            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Сумма</th>
                    <th>Всего накоплено</th>
                </tr>
            </thead>

            <tbody id="table"></tbody>

        </table>

    </div>

    <div class="footer">
        💜 Моя цель — Калининград
    </div>

</div>

<script>

const goal = 60000;

/*
    ЗДЕСЬ МЕНЯЕШЬ СУММЫ.

    Пример:
    { date: "29.09", amount: 800 }

    Можно добавлять новые строки.
*/

const savings = [

    { date: "29.09", amount: 800 },
    { date: "30.09", amount: 800 },
    { date: "01.10", amount: 800 },
    { date: "02.10", amount: 800 },

    { date: "03.10", amount: 800 },
    { date: "04.10", amount: 800 },
    { date: "05.10", amount: 800 },
    { date: "06.10", amount: 800 },
    { date: "07.10", amount: 800 },
    { date: "08.10", amount: 800 },
    { date: "09.10", amount: 800 },
    { date: "10.10", amount: 800 },

    { date: "11.10", amount: 800 },
    { date: "12.10", amount: 800 },
    { date: "13.10", amount: 800 },
    { date: "14.10", amount: 800 },
    { date: "15.10", amount: 800 },
    { date: "16.10", amount: 800 },
    { date: "17.10", amount: 800 },
    { date: "18.10", amount: 800 },

    { date: "19.10", amount: 800 },
    { date: "20.10", amount: 800 },
    { date: "21.10", amount: 800 },
    { date: "22.10", amount: 800 },
    { date: "23.10", amount: 800 },
    { date: "24.10", amount: 800 },
    { date: "25.10", amount: 800 },
    { date: "26.10", amount: 800 },

    { date: "27.10", amount: 800 },
    { date: "28.10", amount: 800 },
    { date: "29.10", amount: 800 },
    { date: "30.10", amount: 800 },
    { date: "31.10", amount: 800 },

    { date: "01.11", amount: 800 },
    { date: "02.11", amount: 800 },
    { date: "03.11", amount: 800 },
    { date: "04.11", amount: 800 },
    { date: "05.11", amount: 800 },
    { date: "06.11", amount: 800 },
    { date: "07.11", amount: 800 },
    { date: "08.11", amount: 800 },

    { date: "09.11", amount: 800 },
    { date: "10.11", amount: 800 },
    { date: "11.11", amount: 800 },
    { date: "12.11", amount: 800 },
    { date: "13.11", amount: 800 },
    { date: "14.11", amount: 800 },
    { date: "15.11", amount: 800 },
    { date: "16.11", amount: 800 },

    { date: "17.11", amount: 800 },
    { date: "18.11", amount: 800 },
    { date: "19.11", amount: 800 },
    { date: "20.11", amount: 800 },
    { date: "21.11", amount: 800 },
    { date: "22.11", amount: 800 },
    { date: "23.11", amount: 800 },
    { date: "24.11", amount: 800 },

    { date: "25.11", amount: 800 },
    { date: "26.11", amount: 800 },
    { date: "27.11", amount: 800 },
    { date: "28.11", amount: 800 },
    { date: "29.11", amount: 800 },
    { date: "30.11", amount: 800 },

    { date: "01.12", amount: 800 },
    { date: "02.12", amount: 800 },
    { date: "03.12", amount: 800 },
    { date: "04.12", amount: 800 },
    { date: "05.12", amount: 800 }

];

let total = 0;

const table = document.getElementById("table");

savings.forEach(item => {

    total += item.amount;

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${item.date}</td>
        <td class="saved">+${item.amount.toLocaleString("ru-RU")} ₽</td>
        <td>${total.toLocaleString("ru-RU")} ₽</td>
    `;

    table.appendChild(row);

});

const percent = Math.min((total / goal) * 100, 100);

document.getElementById("saved").textContent =
    total.toLocaleString("ru-RU") + " ₽";

document.getElementById("left").textContent =
    Math.max(goal - total, 0).toLocaleString("ru-RU") + " ₽";

document.getElementById("percent").textContent =
    percent.toFixed(1) + "%";

document.getElementById("progress").style.width =
    percent + "%";

</script>

</body>
</html>
